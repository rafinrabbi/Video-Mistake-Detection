[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmd"
version = "0.1.0"
description = "Procedural Graph-Guided + Uncertainty-Aware VLM Mistake Detection"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "torchvision",
    "transformers>=4.49",
    "accelerate>=0.30",
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "qwen-vl-utils>=0.0.8",
    "decord>=0.6",
    "pydantic>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.17",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "rich>=13.0",
    "networkx>=3.3",
    "openai>=1.30",
    "outlines>=0.0.46",
    "pytest>=8.0",
]

[project.scripts]
vmd = "vmd.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
